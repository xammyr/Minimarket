version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: minimarket-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword # Cambiar en produccion
      POSTGRES_DB: minimarket
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - minimarket-net

  backend:
    build:
      context: ./minimarket-backend
      dockerfile: Dockerfile
    container_name: minimarket-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/minimarket
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
      - JWT_SECRET=super-secreto-minimarket-produccion-2026-cambiar-esto # Cambiar en produccion
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - minimarket-net

  frontend:
    build:
      context: ./minimarket-frontend
      dockerfile: Dockerfile
    container_name: minimarket-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - minimarket-net

volumes:
  postgres_data:

networks:
  minimarket-net:
    driver: bridge
