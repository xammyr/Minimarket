<div class="cajero-layout">
  
  <!-- FONDO OSCURO (Solo aparece en móvil cuando el menú se abre) -->
  @if (sidebarAbierto()) {
    <div class="sidebar-backdrop" (click)="cerrarSidebar()"></div>
  }

  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside class="sidebar" [class.abierto]="sidebarAbierto()">
    <div class="cajero-profile">
      <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
      <div class="info">
        <h3>Caja Principal</h3>
        <span class="status online">● Operativa</span>
      </div>
    </div>

    <nav class="sidebar-menu">
      <!-- Los routerLink dirigen a la ruta exacta configurada en app.routes.ts -->
      <a routerLink="/caja" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
        <span class="icon"><i class="fa-solid fa-cart-shopping"></i></span> Nueva Venta (POS)
      </a>
      
      <a routerLink="/caja/facturas" routerLinkActive="active" class="menu-item">
        <span class="icon"><i class="fa-solid fa-file-invoice"></i></span> Facturas / Boletas
      </a>
      
      <a routerLink="/caja/compras" routerLinkActive="active" class="menu-item">
        <span class="icon"><i class="fa-solid fa-box-open"></i></span> Registro de Compras
      </a>
      
      <a routerLink="/caja/corte" routerLinkActive="active" class="menu-item">
        <span class="icon"><i class="fa-solid fa-sack-dollar"></i></span> Corte de Caja
      </a>
    </nav>

    <div class="sidebar-footer">
      <div style="padding-bottom: 15px; text-align: center; color: #bdc3c7; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;">
        <i class="fa-solid fa-user-circle"></i> {{ nombreCajero }}
      </div>
      
      <a *ngIf="esAdmin" routerLink="/admin" class="admin-btn">
        <span class="icon"><i class="fa-solid fa-shield-halved"></i></span> Panel Admin
      </a>

      <button class="logout-btn" (click)="logout()">
        <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span> Salir
      </button>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <main class="main-content">
    <header class="top-header">
      <!-- NUEVO BOTÓN HAMBURGUESA (Oculto en PC, visible en móvil) -->
      <button class="btn-menu" (click)="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      
      <h2>Sistema de Caja</h2>
      <div class="time-display">
        Turno Mañana - {{ fechaActual }}
      </div>
    </header>

    <div class="content-area">
      <!-- Agregamos (activate)="cerrarSidebar()" para que el menú se oculte al hacer clic en un enlace -->
      <router-outlet (activate)="cerrarSidebar()"></router-outlet>
    </div>
  </main>

</div>
